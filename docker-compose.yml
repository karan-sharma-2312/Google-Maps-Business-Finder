version: "3.9"

services:
  app:
    build: .
    container_name: bia-app
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - rabbitmq
      - postgres
    volumes:
      - ./:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/system/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bia-redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: bia-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  postgres:
    image: postgres:16-alpine
    container_name: bia-postgres
    environment:
      POSTGRES_DB: business_intelligence
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
